name: Python wheels

# Builds the 'anari' Python wheels (the cffi bindings, the frontend, the sink
# and debug sample devices and the device SDK) with cibuildwheel, validates the
# built wheels in separate jobs that never check out the SDK's sources, and
# publishes them to PyPI through Trusted Publishing (OIDC) when a v* tag is
# pushed and the 'pypi' environment's reviewers approve. Compilation and
# deployment are separate jobs: only the publish jobs get an OIDC token, and
# they build nothing.
#
# The artifact actions stay on v4, which GitHub supports and which act's local
# artifact server understands, so this workflow can be run locally with act.

on:
  push:
    branches: [ next_release ]
    tags: [ 'v*' ] # path filters don't apply to tag pushes
    paths: &wheel_paths
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'code_gen/**'
      - 'src/anari/**'
      - 'src/helium/**'
      - 'src/anari_test_scenes/**'
      - 'src/devices/CMakeLists.txt'
      - 'src/devices/sink/**'
      - 'src/devices/debug/**'
      - 'examples/empty_helium_device/**'
      - 'tests/python/**'
      - '.github/scripts/**'
      - '.github/workflows/python_wheels.yml'
  pull_request:
    branches: [ main, next_release ]
    paths: *wheel_paths
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish the validated wheels to TestPyPI'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages to build (.github/scripts/python_packages.py) and their
  # version: the SDK's, or a post-release of it, shared by every package, equal
  # to the tag on a release, and new to PyPI. PyPI never accepts a version
  # twice, so a release tag that was moved or re-pushed fails here, before
  # anything is built or approved; other runs only warn.
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      packages: ${{ steps.check.outputs.packages }}
      requirements: ${{ steps.check.outputs.requirements }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12' # tomllib
    - id: check
      name: Check the packages' versions
      # The tag reaches the script as data, never as part of the script
      env:
        RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: >
        python .github/scripts/python_packages.py
        --github-output "$GITHUB_OUTPUT"
        ${RELEASE_TAG:+--tag "$RELEASE_TAG" --require-new}

  build-wheels:
    name: build (${{ matrix.package.name }}, ${{ matrix.os }}, ${{ matrix.arch }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check-version.outputs.packages) }}
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest ]
        include:
        - { os: ubuntu-24.04,     arch: x86_64 }  # manylinux_2_28 + musllinux_1_2
        - { os: ubuntu-24.04-arm, arch: aarch64 } # manylinux_2_28 + musllinux_1_2
        # MACOSX_DEPLOYMENT_TARGET 11.0, ARCHFLAGS per architecture: each built
        # on its own architecture, so its wheels are tested natively
        - { os: macos-14,         arch: arm64 }
        - { os: macos-15-intel,   arch: x86_64 }
        - { os: windows-latest,   arch: AMD64 }   # MSVC Latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
      with:
        package-dir: ${{ matrix.package.dir }}
        output-dir: wheelhouse
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wheels-${{ matrix.package.name }}-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  # Installs the built wheels into a clean Python and runs tests/python
  # against them: the bindings, the frontend, the sample devices rendering the
  # tutorial scene, every shared library loading with all symbols bound, the
  # wheel's dependencies, and a vendor device (examples/empty_helium_device)
  # built with nothing but the wheel. Only tests/python and the template
  # device are checked out, so nothing can resolve from the SDK's sources.
  #
  # On a hosted runner the interpreter from setup-python is already a clean,
  # job-private environment, so the steps use it directly (forcing the built
  # wheels over any copy a reused interpreter has): each is a plain
  # 'python -m ...' line that means the same in every runner's default shell
  # (bash, or pwsh on Windows), with values passed as ${{ }} expressions.
  validate:
    name: validate (${{ matrix.name }}, Python ${{ matrix.python }})
    needs: [ check-version, build-wheels ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [ manylinux x86_64, manylinux aarch64, macOS arm64, macOS x86_64, Windows AMD64 ]
        python: [ '3.10', '3.15' ]
        include:
        - { name: manylinux x86_64,  os: ubuntu-24.04 }
        - { name: manylinux aarch64, os: ubuntu-24.04-arm }
        - { name: macOS arm64,       os: macos-14 }
        - { name: macOS x86_64,      os: macos-15-intel }
        - { name: Windows AMD64,     os: windows-latest }
    env:
      ANARI_WHEEL_REQUIRE_VENDOR_BUILD: '1'
      LD_BIND_NOW: '1' # Linux: bind every symbol at load (ignored elsewhere)
    steps:
    - name: Check out only the validation suite and the template device
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |
          tests/python
          examples/empty_helium_device
        sparse-checkout-cone-mode: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - name: Install the validation suite's requirements
      run: python -m pip install -r tests/python/requirements.txt cffi numpy
    - name: Install the built wheels
      # --no-index: PyPI's packages must never stand in for the built wheels;
      # --force-reinstall: nor may a copy already in a reused interpreter
      # (a self-hosted runner's, or act's persistent tool cache)
      run: python -m pip install --no-index --no-deps --force-reinstall --find-links dist ${{ needs.check-version.outputs.requirements }}
    - name: Run the validation suite
      run: python -m pytest tests/python -v -p no:cacheprovider

  # The musllinux wheels, in Alpine containers. The steps run in the container
  # through 'docker run' rather than a job container: actions/checkout and
  # download-artifact are JavaScript actions, which don't run on musl.
  validate-musllinux:
    name: validate (musllinux ${{ matrix.arch }}, Python ${{ matrix.python }})
    needs: [ check-version, build-wheels ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]
        python: [ '3.10', '3.15' ]
        include:
        - { arch: x86_64,  os: ubuntu-24.04 }
        - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
    - name: Check out only the validation suite and the template device
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |
          tests/python
          examples/empty_helium_device
        sparse-checkout-cone-mode: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - name: Validate in python:${{ matrix.python }}-alpine
      run: >
        docker run --rm -v "${{ github.workspace }}:/work" -w /work
        -e ANARI_WHEEL_REQUIRE_VENDOR_BUILD=1
        python:${{ matrix.python }}-alpine sh -euxc '
        apk add --no-cache cmake make g++ binutils;
        python -m venv /venv;
        /venv/bin/python -m pip install -r tests/python/requirements.txt cffi numpy;
        /venv/bin/python -m pip install --no-index --no-deps --find-links dist ${{ needs.check-version.outputs.requirements }};
        /venv/bin/python -m pytest tests/python -v -p no:cacheprovider'

  publish-testpypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi }}
    needs: [ check-version, validate, validate-musllinux ]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/anari/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing; nothing else in this job
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist

  publish-pypi:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: [ check-version, validate, validate-musllinux ]
    runs-on: ubuntu-24.04
    # The environment's required reviewers approve each release
    environment:
      name: pypi
      url: https://pypi.org/project/anari/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing; nothing else in this job
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: dist
