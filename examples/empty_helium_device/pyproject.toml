# 'pip install .' builds the device against the SDK in the 'anari' package

[project]
name = "hecore"
version = "0.1.0"
description = "Minimal helium-based ANARI device (template)"
requires-python = ">=3.10"
license = "Apache-2.0"
# The SDK series whose device interface this implements
dependencies = ["anari~=0.17.0"]

[build-system]
requires = ["py-build-cmake~=0.5.1", "anari~=0.17.0"]
build-backend = "py_build_cmake.build"

[tool.py-build-cmake.module]
generated = "package"

[tool.py-build-cmake.cmake]
build_type = "Release"
source_path = "."
build_args = ["--parallel"]
install_components = ["hecore_module"]
install_args = ["--strip"]
